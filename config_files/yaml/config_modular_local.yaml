#########################
# bact_core configuration
#########################

###Filled by the wrapper
core_input_files:
core_target_files:
output_directory:
input_directory:

###Tool configuration
core_tool_configs:
  kraken2:
    threads: 12
    human_db: resources/databases/db-kraken2/human_reference_t2t/
    ram_host_mb: 262144
    bact_db: resources/databases/db-kraken2/minikraken_bact/ 
    ram_bact_mb: 262144
    phix_db: resources/databases/db-kraken2/phix/
    ram_phix_mb: 4096
  shovill:
    minlen: 1
    mincov: 0
    cpus: 6
    ram: 16
    depth: 100
    modules: --noreadcorr
  fastp:
    thread: 12
    max_len1: 0 #trim bases after given length in read1
    max_len2: 0 #trim bases after given length in read2
  polypolish:
    min_th: 15
    max_th: 55.0
  polca:
    threads: 32
    ram_gbp_thread: 2G
  filtlong:
    keep_percent: 90
  flye:
    threads: 12
  snikt:
    sample_size: 10000
  # fastplong 0.7.1 (https://github.com/OpenGene/fastplong) - ONT read QC report (JSON/HTML); filtered reads are not written.
  # Keys are the fastplong long option names (without "--"); all values below are the tool defaults (fastplong --help).
  # Boolean keys are passed as flags when true; null/empty values are not passed (tool default applies).
  fastplong:
    threads: 3                              # -w/--thread
    report_title: "fastplong report"        # -R/--report_title
    verbose: false                          # -V/--verbose: log progress every 1M reads
    reads_to_process: 0                     # 0 = process all reads
    # adapter trimming (enabled by default)
    disable_adapter_trimming: false
    start_adapter: auto                     # 5' adapter sequence, auto = detect
    end_adapter: auto                       # 3' adapter sequence, auto = detect
    adapter_fasta: ""                       # FASTA with adapter sequences to trim from both ends
    distance_threshold: 0.25                # sequence-adapter distance / adapter length (0.0-1.0)
    trimming_extension: 10                  # extra bases trimmed when an adapter is found
    # chimeric reads (split on internal adapters by default)
    disable_chimera_splitting: false
    discard_chimeric_reads: false
    chimera_min_segment_length: 20
    # fixed-length trimming
    trim_front: 0
    trim_tail: 0
    # polyX trimming at 3' end
    trim_poly_x: false
    poly_x_min_len: 10
    # sliding-window quality cutting
    cut_front: false
    cut_tail: false
    cut_window_size: 4                      # 1-1000, shared by cut_front/cut_tail
    cut_mean_quality: 20                    # 1-36, shared by cut_front/cut_tail
    cut_front_window_size: null             # null = cut_window_size
    cut_front_mean_quality: null            # null = cut_mean_quality
    cut_tail_window_size: null              # null = cut_window_size
    cut_tail_mean_quality: null             # null = cut_mean_quality
    # low-quality region masking (N) / breaking / best segment
    mask: false
    mask_window_size: 50
    mask_mean_quality: 10
    break: false
    break_window_size: 100
    break_mean_quality: 10
    best_read_segment: false
    best_read_segment_window_size: 100
    best_read_segment_mean_quality: 10
    # quality filtering (enabled by default)
    disable_quality_filtering: false
    qualified_quality_phred: 15             # base is qualified if phred >= this
    unqualified_percent_limit: 40           # max % unqualified bases per read
    n_base_limit: 1000000                   # max N bases per read (1000000 = no limit)
    n_percent_limit: 10                     # max % N bases per read
    mean_qual: 0                            # min mean read quality (0 = no requirement)
    # length filtering (enabled by default)
    disable_length_filtering: false
    length_required: 20                     # min read length
    length_limit: 0                         # max read length (0 = no limit)
    # low complexity / GC filters
    low_complexity_filter: false
    complexity_threshold: 30
    min_gc: 0
    max_gc: 100
  # Batch aggregation of fastplong reports (reports/fastplong_report.csv, reports/fastplong_adapters.fasta) - not fastplong options
  fastplong_report:
    max_adapter_length: 100                 # detected adapters longer than this are not written to fastplong_adapters.fasta
  medaka:
    threads: 12
    ram_mb: 6144
  ont_assembly: 'hybracter'
  circlator:
    skip: True
  hybracter:
    threads: 4

